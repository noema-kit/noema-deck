name: Release

# Pushing a tag such as `v0.1.0` builds the macOS app for Apple silicon and
# Intel and publishes it as the release of that tag. The app is signed ad hoc,
# not with a Developer ID, so macOS asks once before it first opens.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain for both architectures
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag names this version
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version crates/noema-deck/tauri.conf.json)"
      - name: Build the app and its disk image
        working-directory: crates/noema-deck
        run: npx --yes @tauri-apps/cli@2.12.6 build --target universal-apple-darwin --bundles app,dmg
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            --title "Noema Deck $GITHUB_REF_NAME" --generate-notes \
            --notes "Noema Deck is not notarised. After moving it to Applications, open it once, then choose **Open Anyway** in System Settings → Privacy & Security."
